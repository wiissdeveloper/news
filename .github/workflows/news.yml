name: Update News

on:
  schedule:
    - cron: "0 */12 * * *"  # Ejecuta cada 12 horas (00:00 y 12:00 UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # Red de seguridad: mata el proceso si supera los 10 min

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm install

      - name: Generate all languages
        run: node scripts/generate-news.js

      - name: Commit changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add news_*.json
          git commit -m "Auto update multi-language news" || echo "No changes"
          git push