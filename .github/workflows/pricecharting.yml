name: Update PriceCharting

on:
  schedule:
    - cron: "0 6 * * *"  # Ejecuta 1 vez al día a las 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # Red de seguridad: mata el proceso si supera los 10 min

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm install

      - name: Generate price list
        run: node scripts/generate-pricecharting.js

      - name: Commit changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add prices.json
          git commit -m "Auto update pricecharting list" || echo "No changes"
          git push